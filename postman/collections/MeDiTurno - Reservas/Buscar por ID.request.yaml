$kind: http-request
order: 2000
method: GET
url: '{{baseUrl}}/reservas/{{reservaId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code es 200 o 404", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 404]);
      });

      if (pm.response.code === 200) {
        pm.test("El body tiene los campos requeridos", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("id");
          pm.expect(jsonData).to.have.property("nombreCliente");
          pm.expect(jsonData).to.have.property("fecha");
          pm.expect(jsonData).to.have.property("hora");
          pm.expect(jsonData).to.have.property("cantidadPersonas");
          pm.expect(jsonData).to.have.property("estado");
        });
      }
