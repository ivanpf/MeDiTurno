$kind: http-request
order: 4000
method: PUT
url: '{{baseUrl}}/reservas/{{reservaId}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nombreCliente": "Juan Pérez Actualizado",
      "fecha": "2026-10-20",
      "hora": "14:30:00",
      "cantidadPersonas": 3,
      "estado": "CONFIRMADA"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code es 200 o 404", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 404]);
      });

      if (pm.response.code === 200) {
        pm.test("nombreCliente es Juan Pérez Actualizado", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.nombreCliente).to.eql("Juan Pérez Actualizado");
        });

        pm.test("El estado es CONFIRMADA", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.estado).to.eql("CONFIRMADA");
        });
      }
