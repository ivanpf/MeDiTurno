$kind: http-request
order: 3000
method: POST
url: '{{baseUrl}}/reservas'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nombreCliente": "Juan Pérez",
      "fecha": "2026-10-15",
      "hora": "10:00:00",
      "cantidadPersonas": 2
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code es 200 o 201", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });

      pm.test("El body tiene campo id", function () {
        var jsonData = pm.response.json();
        pm.expect(jsonData).to.have.property("id");
      });

      pm.test("El estado es PENDIENTE", function () {
        var jsonData = pm.response.json();
        pm.expect(jsonData.estado).to.eql("PENDIENTE");
      });

      pm.environment.set("reservaId", pm.response.json().id.toString());
