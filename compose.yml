services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: postgres-mediturno
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mediturno}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mediturno123}
      POSTGRES_DB: ${POSTGRES_DB:-mediturno_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - mediturno-net

  backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    container_name: backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-mediturno_db}
      DB_USER: ${POSTGRES_USER:-mediturno}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-mediturno123}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mediturno-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - mediturno-net

networks:
  mediturno-net:
    driver: bridge

volumes:
  postgres-data:
