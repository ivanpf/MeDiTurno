server:
  port: 8080

spring:
  mail:
    # Servidor de correo (SMTP). En desarrollo es Mailpit (ver compose.yml); en producción, el servidor real.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USUARIO:}
    password: ${MAIL_CLAVE:}
    properties:
      mail.smtp.auth: ${MAIL_AUTENTICAR:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:mediturno_db}
    username: ${DB_USER:mediturno}
    password: ${DB_PASSWORD:mediturno123}
  mvc:
    format:
      date: iso   # las fechas que viajan en la URL (por ejemplo, la vista previa de una suspensión) son aaaa-mm-dd
      time: iso
  jpa:
    hibernate:
      ddl-auto: validate # Hibernate no crea ni modifica tablas: lo hacen las migraciones de Flyway (db/migration)
    show-sql: true
    open-in-view: false

  flyway:
    # db/seed tiene los usuarios de prueba (migración repetible). En producción se quita esa carpeta de la lista.
    locations: classpath:db/migration,classpath:db/seed

mediturno:
  push:
    # Token de acceso de Expo para producción; en desarrollo puede dejarse vacío.
    access-token: ${EXPO_ACCESS_TOKEN:}
    url: https://exp.host/--/api/v2/push/send
  correo:
    remitente: ${MAIL_REMITENTE:MeDiTurno <no-responder@mediturno.local>}
  firebase:
    # Archivo con la clave de servicio de Firebase. Nunca se sube al repositorio (la carpeta secrets/ está ignorada por Git).
    credenciales: ${FIREBASE_CREDENCIALES:../secrets/firebase-clave.json}
  reservas:
    # Hasta cuántas semanas hacia adelante se puede reservar (CU-8: "dentro de las próximas ocho semanas"). La tarea programada
    # genera las fechas de los turnos hasta ahí, y CU-8 tiene que usar este mismo valor para validar la fecha elegida.
    semanas-adelante: 8
  ocurrencias:
    cron: "0 0 2 * * *"       # cuándo se generan las fechas de los turnos (todos los días a las 2:00)
