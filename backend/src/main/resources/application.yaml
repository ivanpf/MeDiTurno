server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:mediturno_db}
    username: ${DB_USER:mediturno}
    password: ${DB_PASSWORD:mediturno123}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
  jpa:
    hibernate:
      ddl-auto: validate # Hibernate no crea ni modifica tablas: lo hacen las migraciones de Flyway (db/migration)
    show-sql: true
    open-in-view: false

  flyway:
    # db/seed tiene los usuarios de prueba (migración repetible). En producción se quita esa carpeta de la lista.
    locations: classpath:db/migration,classpath:db/seed

mediturno:
  firebase:
    # Archivo con la clave de servicio de Firebase. Nunca se sube al repositorio (la carpeta secrets/ está ignorada por Git).
    credenciales: ${FIREBASE_CREDENCIALES:../secrets/firebase-clave.json}
  email:
    remitente: ${MAIL_FROM:no-reply@mediturno.local}
